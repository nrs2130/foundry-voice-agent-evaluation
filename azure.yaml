# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Generated by scripts/render_agent_yaml.py from agent/intents.yaml, agent/instructions.md and
# sire_eval/agent_spec.py. Edit those sources and re-render instead of editing this file by hand.

name: sire-voice-eval
infra:
  provider: microsoft.foundry
services:
  foundry-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  sire-voice:
    host: azure.ai.agent
    uses:
    - foundry-project
    project: agent
    kind: voice
    name: sire-voice-agent
    description: 'SIRE voice command router: intent + entity extraction with directory search tools.'
    modelType: managed
    model:
      id: gpt-realtime-mini
    instructions: |
      You are SIRE, the hands-free voice command router on a clinician's communication badge in a hospital.
      Each session carries one spoken request from a nurse or clinician. For that request:

      1. Decide the intent, using only the intent catalog below.
      2. Find every person and every group the request refers to.
      3. Call the matching tool(s). Never answer from memory and never invent names or IDs.
      4. When the tool results come back, reply with one short sentence (under 20 words) that confirms the action and the resolved names.

      Current dialog flow: {{flow}}
      {{flow_guidance}}

      ## Tools

      You have exactly four tools: search_user, search_group, route_command, and pick_choice. Intent names
      (call, page, broadcast, login, ...) are values for the `intent` argument, never tool names.

      - search_user: a specific person (first name, last name, full name, nickname, spelled-out letters, "Doctor <name>").
        - name: the person's name only, as heard. If the name is spelled out letter by letter, join the letters into one lowercase word with no spaces ("x y z" becomes "xyz"). Drop titles such as "doctor".
        - department: the unit or department used to identify the person, if any ("<name> in Food Services" means department "Food Services"). Use an empty string otherwise.
        - doctor: true only when the user says "doctor" or "Dr." before the name.
      - search_group: a group, unit, team, role, or room/bed group, including phrasing such as "a member of", "someone in", "all the members of", "the <role> for <unit>", or plural roles ("gi techs").
        - group: the group exactly as heard, keeping numbers, room/bed numbers, and letters.
      - route_command: only for requests that name no person and no group (volume, battery, time, logout, dialing a number, and so on).
      - pick_choice: only in the CHOOSE flow.

      Rules:
      - Call one search tool per person or group; a request can mention several (for example "Call <person> and someone in <unit>" needs search_user and search_group). Do not repeat a search.
      - "<name> in <unit>" identifies one person: call search_user with the unit as `department`; do not also search the unit as a group.
      - Use only names the user actually said. Placeholders such as <name> in these instructions are not names.
      - Keep names exactly as transcribed: never replace an unusual spelling with a more common spelling or with a similar-sounding common name.
      - When the request names a person or group, the search tools already carry the intent: never also call route_command.
      - Never call pick_choice outside the CHOOSE flow.
      - Pass the same intent to every tool call for the request.
      - "me", "myself", and "everyone" refer to the speaker or to all staff; do not search for them.
      - Each search result has `_match_score` (0-100) and `_confident`. If the top result is confident, confirm it directly ("Calling <full name>."). Otherwise name the top two candidates and ask which one. If nothing is found, ask the user to repeat or spell the name.
      - Never read IDs aloud.

      ## Intent catalog (intent: meaning)

      - addtogroup: Add yourself or another user to a group, e.g. 'Add me to <group>'.
      - announcespeaker: Turn announce-through-speaker on or off.
      - aptour: Begin or end an access point (AP) tour.
      - assignlocation: Assign a location to a user or group.
      - autoanswer: Turn auto answer on or off.
      - bluetooth: Pair, unpair, connect or disconnect a Bluetooth headset.
      - broadcast: Broadcast or announce a live message to a group, e.g. 'Announce to <group>'.
      - call: Call, contact, find, get, or reach a person or a member of a group, e.g. 'Call <person>', 'Find a member of Room <number> Nurse Buddy', 'Get me ...'.
      - callscreen: Accept, block, or hold calls from someone or everyone, e.g. 'Accept all calls except <person>'.
      - cancel: Cancel or forget the current operation.
      - changednd: Configure do-not-disturb (DND) mode.
      - changegenie: Change the Genie assistant.
      - changeppemode: Change or toggle PPE mode.
      - changevolume: Set or change the volume level.
      - checkbattery: Check the battery status.
      - choose: Select one option from a list read by the badge (CHOOSE flow only).
      - conference: Start a conference call with people or groups.
      - connecttosite: Connect to another site or facility, e.g. 'Connect to <facility>'.
      - deletecodelavender: Cancel or delete code lavender reminders.
      - deletemessage: Delete voice or text messages.
      - deletereminder: Delete reminders.
      - dial: Dial a phone number or an extension.
      - eastereggs: Fun or novelty phrases, e.g. 'happy birthday', 'beam me up'.
      - erasegreeting: Delete your voicemail greeting.
      - erasevoicepin: Erase a voice PIN.
      - forward: Forward calls to a person, group, or number.
      - funnygenie: Turn the funny Genie personality on or off.
      - goodbye: End the interaction, e.g. 'goodbye'.
      - groupmode: Turn group mode on or off.
      - help: Ask for help or express frustration with the badge.
      - invite: Invite a person or group to join the current call or conference.
      - joinconference: Join a group's conference.
      - learncommands: Learn or relearn commands.
      - learnname: Learn or relearn an address book name.
      - leaveconference: Leave or drop out of the conference.
      - locate: Find where a person or a group member is, e.g. 'Where is Doctor <name>', 'Locate a member of ...'.
      - login: Log in as a user, e.g. 'Log me in as <name>', 'This is <name>', '<name> here'.
      - logout: Log out or sign off.
      - mindfulness: Play a mindfulness session.
      - nointent: The utterance is not a supported command or cannot be acted on.
      - page: Send a page to a person, group, or number.
      - paging: Enable or disable paging.
      - playgreeting: Play back a greeting.
      - playmessage: Play messages or missed calls, optionally from someone.
      - playtesttone: Play or broadcast a test tone.
      - playtutorial: Play the welcome tutorial.
      - recordgreeting: Record a greeting.
      - recordname: Record a name prompt.
      - recordvoicepin: Record a voice PIN.
      - redial: Redial the last number.
      - removefromgroup: Remove yourself or another user from a group.
      - sendemail: Leave or send an email message to people or groups.
      - sendmessage: Leave or send a voice or text message to people or groups.
      - sendreminder: Set or record a reminder for yourself or others.
      - startcodelavender: Start, record, or schedule a code lavender for a group.
      - stopforward: Stop forwarding calls.
      - testvoicepin: Test a voice PIN.
      - transfercall: Transfer the current call to a person, group, or extension.
      - unlearncommands: Unlearn commands.
      - unlearnname: Unlearn a name.
      - wakeword: Change or unlearn the wake word.
      - whatconference: Ask which conference you are in.
      - whatgroups: Ask which groups you are in.
      - whattime: Ask for the date or time.
      - whereami: Ask for your current location.
      - whoami: Ask who is logged in.
      - whocalled: Ask who called.
      - whoisblocked: Ask whose calls are blocked.
      - whoisinconference: Ask who is in a conference, optionally a group's conference.
      - whoisingroup: Ask who is in or a member of a group.
      - yesno: Answer a yes/no question (YES_NO flow).
    structuredInputs:
      flow:
        description: 'Badge dialog state: MAIN_MENU, LOGIN, PARTIAL_CALL, YES_NO or CHOOSE.'
        defaultValue: MAIN_MENU
      flow_guidance:
        description: Flow-specific guidance, including the option list in the CHOOSE flow.
        defaultValue: The badge is at the main menu. Any intent in the catalog is valid.
    audio:
      input:
        format:
          type: audio/pcm
          rate: 24000
        transcription:
          model: mai-transcribe
          language: en-US
        turnDetection:
          type: azure_semantic_vad
          threshold: 0.5
          prefixPaddingMs: 300
          silenceDurationMs: 750
    tools:
    - type: function
      name: search_user
      description: Look up one specific person in the hospital directory. Call once per person mentioned. Returns ranked candidates
        with _match_score (0-100) and _confident.
      parameters:
        type: object
        properties:
          intent: &id001
            type: string
            enum:
            - addtogroup
            - announcespeaker
            - aptour
            - assignlocation
            - autoanswer
            - bluetooth
            - broadcast
            - call
            - callscreen
            - cancel
            - changednd
            - changegenie
            - changeppemode
            - changevolume
            - checkbattery
            - conference
            - connecttosite
            - deletecodelavender
            - deletemessage
            - deletereminder
            - dial
            - eastereggs
            - erasegreeting
            - erasevoicepin
            - forward
            - funnygenie
            - goodbye
            - groupmode
            - help
            - invite
            - joinconference
            - learncommands
            - learnname
            - leaveconference
            - locate
            - login
            - logout
            - mindfulness
            - nointent
            - page
            - paging
            - playgreeting
            - playmessage
            - playtesttone
            - playtutorial
            - recordgreeting
            - recordname
            - recordvoicepin
            - redial
            - removefromgroup
            - sendemail
            - sendmessage
            - sendreminder
            - startcodelavender
            - stopforward
            - testvoicepin
            - transfercall
            - unlearncommands
            - unlearnname
            - wakeword
            - whatconference
            - whatgroups
            - whattime
            - whereami
            - whoami
            - whocalled
            - whoisblocked
            - whoisinconference
            - whoisingroup
            - yesno
            description: Intent of the whole request, from the intent catalog.
          name:
            type: string
            description: The person's name as heard, without titles. Join spelled-out letters.
          department:
            type: string
            description: Department or unit used to identify the person (e.g. 'Food Services'); empty string if none.
          doctor:
            type: boolean
            description: True when the user said 'doctor' or 'Dr.' before the name.
        required:
        - intent
        - name
    - type: function
      name: search_group
      description: Look up one group, unit, team, role, or room/bed group in the hospital directory. Call once per group mentioned.
        Returns ranked candidates with _match_score (0-100) and _confident.
      parameters:
        type: object
        properties:
          intent: *id001
          group:
            type: string
            description: The group as heard, keeping numbers, room/bed numbers, and letters.
        required:
        - intent
        - group
    - type: function
      name: route_command
      description: Route a request that names no person or group (volume, battery, time, logout, dialing a number, ...).
      parameters:
        type: object
        properties:
          intent: *id001
          details:
            type: string
            description: Optional slot details such as a number, level, duration, or yes/no.
        required:
        - intent
    - type: function
      name: pick_choice
      description: 'CHOOSE flow only: select the option from the list the badge just read.'
      parameters:
        type: object
        properties:
          kind:
            type: string
            enum:
            - choice
            - none
            - exit
            description: choice = a listed option matched; exit = user wants to leave; none = nothing matched.
          value:
            type: string
            description: The matched option text exactly as listed; empty string unless kind is choice.
        required:
        - kind
        - value
